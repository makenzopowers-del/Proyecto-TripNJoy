<app-header (abrirLogin)="isLoginVisible = true"></app-header>

<router-outlet></router-outlet>

<app-footer></app-footer>

<!-- Modal de Login -->
@if (isLoginVisible) {
  <app-login (cerrarLogin)="isLoginVisible = false"></app-login>
}

<!-- Modal de Registro -->
@if (isRegistroVisible) {
  <app-registro (cerrarRegistro)="isRegistroVisible = false"></app-registro>
}

<!-- Modal de Plan de Viaje -->
@if (isPlanViajeVisible) {
  <app-plan-viaje-1 (cerrar)="isPlanViajeVisible = false"></app-plan-viaje-1>
}

<!-- Sección Qué Ofrecemos (sin duplicados) -->
<app-que-ofrecemos 
  (abrirLoginModal)="isLoginVisible = true"
  (abrirRegistroModal)="isRegistroVisible = true">
</app-que-ofrecemos>
